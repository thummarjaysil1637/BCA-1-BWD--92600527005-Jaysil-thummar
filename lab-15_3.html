<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Table Using Bootstrap Grid</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Styling to make grid rows and cells look like table borders */
    .grid-table .row {
      border-bottom: 1px solid #1b4671;
    }
    .grid-table .col {
      padding: 12px;
      border-right: 1px solid #3c25e9ad;
    }
    .grid-table .col:first-child {
      border-left: 1px solid #dee2e6;
    }
    .grid-table .table-header {
      border-top: 1px solid #e68611;
    }
  </style>
</head>
<body>

  <div class="container my-4">
    <h3 class="mb-3 text-center">Student List (Bootstrap Grid Table)</h3>

    <div class="grid-table">
      <!-- Table Header -->
      <div class="row table-header bg-dark text-white fw-bold">
        <div class="col">ID</div>
        <div class="col">Name</div>
        <div class="col">Course</div>
        <div class="col">City</div>
      </div>

      <!-- Table Row 1 -->
      <div class="row bg-light">
        <div class="col">101</div>
        <div class="col">John Doe</div>
        <div class="col">BCA</div>
        <div class="col">Rajkot</div>
      </div>

      <!-- Table Row 2 -->
      <div class="row">
        <div class="col">102</div>
        <div class="col">Jane Smith</div>
        <div class="col">B.Sc IT</div>
        <div class="col">Ahmedabad</div>
      </div>

      <!-- Table Row 3 -->
      <div class="row bg-light">
        <div class="col">103</div>
        <div class="col">Alex Brown</div>
        <div class="col">MCA</div>
        <div class="col">Surat</div>
      </div>
    </div>
  </div>

</body>
</html>
