<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover in Image</title>
    <style>
        img{
            transition: 0.8s;
            cursor: pointer;
        }
        img:hover{
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <img src="newsom.jpg" alt="candle" height="900px" width="1000px">
</body>
</html>
