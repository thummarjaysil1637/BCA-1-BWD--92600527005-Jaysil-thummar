<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perform Internal CSS for text property</title>
<style>
    h1 {
        color: deeppink;
        font-size: 60px;
        font-family: Georgia, 'Times New Roman', Times, serif;
        text-transform: capitalize;
    }
    p {
        color: rgb(29, 187, 208);
        font-size: 30px;
        text-align: center;
        letter-spacing:7px ;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        text-transform: inherit;
    }
    h4{
        color: rgb(137, 73, 33);
        font-size: 40px;
        text-align: left;
        font-family: Georgia, 'Times New Roman', Times, serif;
        text-transform: uppercase;
    }

</style>
</head>
<body>
    <center>
    <p><h1>Text property</h1></p>
</center>
<p>Lorem ipsum dolor sit amet consectetur adipisicing elit. </p><br>
<p><h4>Lorem ipsum dolor sit amet, consectetur adipisicing elit. </h4></p>
</body>
</html>
