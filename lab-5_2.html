

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAP</title>
</head>
<body>

    <h2>Circle Image Map</h2>

    <img src="image.png" usemap="#map2" width="500" height="600">

    <map name="map2">
        <area shape="circle" coords="250,150,80"
            href="https://www.google.com" alt="Circle">
    </map>

</body>
</html>
