<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 40px;
            color: #333;
        }
        h2 {
            text-align: center;
            color: #444;
        }
        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #0056b3;
            color: rgb(255, 255, 255);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
       
    </style>
</head>
<body>

    <h2>Product Inventory</h2>

    <table>
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Company</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>A-3728</td>
                <td>Wireless Noise-Canceling Headphones</td>
                <td>2000</td>
                <td>AudioTech Inc.</td>
            </tr>
            <tr>
                <td>A-8732</td>
                <td>Ergonomic Office Chair</td>
                <td>5000</td>
                <td>Comfort Plus</td>
            </tr>
            <tr>
                <td>A-4873</td>
                <td>4K Ultra HD Monitor</td>
                <td>50,000</td>
                <td>Visionary Displays</td>
            </tr>
            <tr>
                <td>A-3478</td>
                <td>Mechanical Keyboard</td>
                <td>1500</td>
                <td>KeyStroke</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
