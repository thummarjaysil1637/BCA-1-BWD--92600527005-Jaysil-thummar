<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank & Donor Registration Portal</title>
    <style>
        /* Modern CSS Variables & Resets */
        :root {
            --primary-color: #d32f2f;
            --primary-hover: #b71c1c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border-color: #ced4da;
            --success-color: #2e7d32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border-top: 8px solid var(--primary-color);
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Form Layout Architecture */
        fieldset {
            border: none;
            margin-bottom: 30px;
        }

        legend {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-hover);
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            width: 100%;
            padding-bottom: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 500;
            font-size: 0.9rem;
        }

        label.required::after {
            content: " *";
            color: var(--primary-color);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.15);
        }

        /* Radio group styling */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: normal;
        }

        /* Eligibility Checkbox Box */
        .checkbox-container {
            background-color: #fff8f8;
            border: 1px dashed rgba(211, 47, 47, 0.3);
            padding: 15px;
            border-radius: 6px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .checkbox-container input {
            margin-top: 5px;
            transform: scale(1.2);
            cursor: pointer;
        }

        /* Button Configuration */
        .btn-submit {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* Dynamic Notification Popups via Javascript */
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            display: none;
            font-weight: 500;
        }
        .alert-success {
            background-color: #e8f5e9;
            color: var(--success-color);
            border: 1px solid #c8e6c9;
        }

        /* Responsive Breakpoints */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .container {
                padding: 20px;
                margin: 10px auto;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>🩸 Blood Donor Registration</h1>
            <p>Your single donation can save up to three lives. Fill out the application below to register.</p>
        </header>

        <!-- Notification Banner -->
        <div id="successAlert" class="alert alert-success">
            🎉 Registration successful! Thank you for your lifesaving choice.
        </div>

        <!-- Registration Form -->
        <form id="bloodDonationForm" onsubmit="handleFormSubmit(event)">
            
            <!-- Section 1: Donor Profile -->
            <fieldset>
                <legend>1. Personal Identity Profile</legend>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName" class="required">Full Legal Name</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label for="dob" class="required">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required min="1960-01-01" max="2008-12-31">
                    </div>

                    <div class="form-group">
                        <label class="required">Biological Gender</label>
                        <div class="radio-group">
                            <label class="radio-label"><input type="radio" name="gender" value="Male" required> Male</label>
                            <label class="radio-label"><input type="radio" name="gender" value="Female"> Female</label>
                            <label class="radio-label"><input type="radio" name="gender" value="Other"> Other</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="bloodGroup" class="required">Target Blood Type</label>
                        <select id="bloodGroup" name="bloodGroup" required>
                            <option value="" disabled selected>-- Select Blood Group --</option>
                            <option value="A+">A Positive (A+)</option>
                            <option value="A-">A Negative (A-)</option>
                            <option value="B+">B Positive (B+)</option>
                            <option value="B-">B Negative (B-)</option>
                            <option value="O+">O Positive (O+)</option>
                            <option value="O-">O Negative (O-)</option>
                            <option value="AB+">AB Positive (AB+)</option>
                            <option value="AB-">AB Negative (AB-)</option>
                            <option value="Unknown">Unknown / Not Checked</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- Section 2: Contact Information -->
            <fieldset>
                <legend>2. Communication & Logistics</legend>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="phone" class="required">Mobile Phone Number</label>
                        <input type="tel" id="phone" name="phone" required placeholder="9876543210" pattern="[0-9]{10,}">
                    </div>

                    <div class="form-group">
                        <label for="email" class="required">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="john.doe@example.com">
                    </div>

                    <div class="form-group full-width">
                        <label for="address" class="required">Residential Mailing Address</label>
                        <textarea id="address" name="address" rows="3" required placeholder="Street address, City, State, ZIP Code"></textarea>
                    </div>
                </div>
            </fieldset>

            <!-- Section 3: Health Screening Questionnaire -->
            <fieldset>
                <legend>3. Preliminary Health Self-Screening</legend>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="weight" class="required">Current Weight (kg)</label>
                        <input type="number" id="weight" name="weight" min="45" max="200" required placeholder="Min 50 kg required">
                    </div>

                    <div class="form-group">
